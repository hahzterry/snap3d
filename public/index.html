<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap3d — photo → editable 3D, by Claude Fable 5</title>
<style>
  :root { --bg:#0a0c10; --panel:rgba(20,24,32,.72); --line:rgba(255,255,255,.08); --txt:#e8ecf3; --dim:#8b93a3; --accent:#3ce0c3; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 ui-sans-serif,-apple-system,'Segoe UI',sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  .panel { position:fixed; backdrop-filter:blur(18px); background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  #left { top:16px; left:16px; width:280px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:22px; letter-spacing:.3px; } h1 em { color:var(--accent); font-style:normal; }
  .sub { color:var(--dim); font-size:12px; }
  #drop { border:1.5px dashed rgba(255,255,255,.2); border-radius:12px; padding:14px; text-align:center; cursor:pointer; transition:.2s; color:var(--dim); font-size:13px; }
  #drop:hover, #drop.over { border-color:var(--accent); color:var(--txt); background:rgba(60,224,195,.06); }
  #thumb { max-width:100%; border-radius:10px; display:none; }
  button { background:var(--accent); color:#04241d; border:0; border-radius:10px; padding:10px 14px; font-weight:700; font-size:13px; cursor:pointer; transition:.15s; }
  button:hover { filter:brightness(1.1); transform:translateY(-1px); }
  button:disabled { opacity:.4; cursor:default; transform:none; }
  button.ghost { background:rgba(255,255,255,.08); color:var(--txt); }
  #remixRow { display:flex; gap:8px; }
  input[type=text] { flex:1; background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:10px; color:var(--txt); padding:9px 11px; font-size:13px; outline:none; }
  input[type=text]:focus { border-color:var(--accent); }
  #parts { top:16px; right:16px; width:250px; max-height:calc(100vh - 32px); overflow:auto; display:none; }
  #parts h2 { font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim); margin-bottom:10px; }
  .part { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:9px; cursor:pointer; font-size:13px; }
  .part:hover, .part.sel { background:rgba(60,224,195,.1); }
  .part .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .part input[type=color] { width:22px; height:22px; border:0; background:none; padding:0; cursor:pointer; margin-left:auto; }
  .part input[type=range] { width:70px; accent-color:var(--accent); }
  #status { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(18px); border-radius:99px; padding:9px 20px; font-size:13px; display:none; align-items:center; gap:10px; }
  .spin { width:14px; height:14px; border:2px solid var(--accent); border-top-color:transparent; border-radius:50%; animation:r 0.8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  #badge { position:fixed; bottom:16px; right:16px; font-size:11px; color:var(--dim); }
  #badge b { color:var(--accent); }
</style>
</head>
<body>
<div id="stage"></div>

<div class="panel" id="left">
  <div><h1>snap<em>3d</em></h1><div class="sub">one photo → an editable 3D model</div></div>
  <div id="drop">drop a photo here<br>or click to choose</div>
  <img id="thumb" alt="">
  <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <button id="go" disabled>⟶ Rebuild in 3D</button>
  <div id="remixRow" style="display:none">
    <input id="remix" type="text" placeholder='remix: "make the wheels huge"'>
    <button id="remixGo" class="ghost">✦</button>
  </div>
  <button id="obj" class="ghost" style="display:none">Export .obj</button>
</div>

<div class="panel" id="parts"><h2>Parts <span id="pcount"></span></h2><div id="plist"></div></div>
<div id="status"><div class="spin"></div><span id="stext"></span></div>
<div id="badge">spatial reasoning by <b>Claude Fable 5</b></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10);
scene.fog = new THREE.Fog(0x0a0c10, 12, 30);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 100);
camera.position.set(4.5, 3, 5.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.6;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x202028, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(5, 8, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color:0x0e1117, roughness:.9 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.PolarGridHelper(14, 16, 8, 64, 0x1c2430, 0x141a24));

let model = new THREE.Group(); scene.add(model);
let current = null, selected = null;

const GEO = {
  box: d => new THREE.BoxGeometry(...d),
  cylinder: d => new THREE.CylinderGeometry(d[0], d[1] ?? d[0], d[2] ?? d[1], 32),
  sphere: d => new THREE.SphereGeometry(d[0], 32, 24),
  cone: d => new THREE.ConeGeometry(d[0], d[1], 32),
  torus: d => new THREE.TorusGeometry(d[0], d[1], 16, 48),
};

function build(sceneJSON) {
  current = sceneJSON;
  scene.remove(model); model = new THREE.Group();
  for (const p of sceneJSON.parts) {
    try {
      const mesh = new THREE.Mesh(GEO[p.shape]?.(p.dim) || GEO.box([.3,.3,.3]),
        new THREE.MeshStandardMaterial({ color:p.color || '#999', roughness:.55, metalness:.15 }));
      mesh.position.set(...p.pos); mesh.rotation.set(...p.rot.map(THREE.MathUtils.degToRad));
      mesh.castShadow = mesh.receiveShadow = true; mesh.userData.part = p;
      model.add(mesh);
    } catch {}
  }
  // pop-in animation
  model.scale.setScalar(0.01);
  scene.add(model);
  renderParts();
  document.getElementById('parts').style.display = 'block';
  document.getElementById('remixRow').style.display = 'flex';
  document.getElementById('obj').style.display = 'block';
}

function renderParts() {
  const list = document.getElementById('plist'); list.innerHTML = '';
  document.getElementById('pcount').textContent = `(${current.parts.length})`;
  model.children.forEach(mesh => {
    const p = mesh.userData.part;
    const row = document.createElement('div'); row.className = 'part';
    row.innerHTML = `<span class="dot" style="background:${p.color}"></span><span>${p.name}</span>`;
    const scale = Object.assign(document.createElement('input'), { type:'range', min:30, max:250, value:100 });
    scale.oninput = () => mesh.scale.setScalar(scale.value/100);
    const color = Object.assign(document.createElement('input'), { type:'color', value:p.color });
    color.oninput = () => { mesh.material.color.set(color.value); row.querySelector('.dot').style.background = color.value; };
    row.append(scale, color);
    row.onclick = e => { if (e.target !== row && !e.target.classList.contains('dot') && e.target.tagName !== 'SPAN') return;
      document.querySelectorAll('.part').forEach(x => x.classList.remove('sel')); row.classList.add('sel');
      selected?.material.emissive.set(0); selected = mesh; mesh.material.emissive.set(0x0f4a3f); };
    list.appendChild(row);
  });
}

// --- photo intake ---
const drop = document.getElementById('drop'), file = document.getElementById('file'),
      thumb = document.getElementById('thumb'), go = document.getElementById('go');
let imageData = null;
drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); };
file.onchange = () => load(file.files[0]);
function load(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { imageData = r.result; thumb.src = imageData; thumb.style.display = 'block'; go.disabled = false; };
  r.readAsDataURL(f);
}

function status(msg) {
  const el = document.getElementById('status');
  el.style.display = msg ? 'flex' : 'none';
  document.getElementById('stext').textContent = msg || '';
}

async function call(body, msg) {
  status(msg);
  try {
    const res = await fetch('/api/generate', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    build(data);
  } catch (e) { alert('generation failed: ' + e.message); }
  status(null);
}

go.onclick = () => call({ image: imageData }, 'Fable 5 is reasoning about depth & hidden geometry…');
document.getElementById('remixGo').onclick = () => {
  const t = document.getElementById('remix').value.trim();
  if (t && current) call({ instruction: t, scene: current }, `remixing: "${t}"…`);
};
document.getElementById('remix').onkeydown = e => { if (e.key === 'Enter') document.getElementById('remixGo').click(); };

document.getElementById('obj').onclick = () => {
  const blob = new Blob([new OBJExporter().parse(model)], { type:'text/plain' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: (current?.name || 'snap3d').replace(/\s+/g,'-') + '.obj' });
  a.click();
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  if (model.scale.x < 1) model.scale.setScalar(Math.min(1, model.scale.x + 0.06));
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
